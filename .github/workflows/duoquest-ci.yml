name: DuoQuest CI
on:
  push:
    paths:
      - 'docs/duoquest/**'
      - 'tests/duoquest.test.mjs'
      - '.github/workflows/duoquest-ci.yml'
  pull_request:
    paths:
      - 'docs/duoquest/**'
      - 'tests/duoquest.test.mjs'
      - '.github/workflows/duoquest-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/duoquest.test.mjs
      - run: node --check docs/duoquest/app.mjs
      - run: node --check docs/duoquest/engine.mjs
      - run: node --check docs/duoquest/sw.js
